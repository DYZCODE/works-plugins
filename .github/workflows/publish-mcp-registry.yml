name: Publish to MCP Registry

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Match tag to manifest version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r '.version' server.json)" = "$version"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$version"
          test "$(jq -r '.version' plugins/works-public/.claude-plugin/plugin.json)" = "$version"
          test "$(jq -r '.version' plugins/works-public/.codex-plugin/plugin.json)" = "$version"
          test "$(jq -r '.name' server.json)" = \
            "io.github.${GITHUB_REPOSITORY_OWNER}/works-public"

      - name: Validate server metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --header "Content-Type: application/json" \
            --data-binary @server.json \
            https://registry.modelcontextprotocol.io/v0/validate \
            > validation.json
          test "$(jq -r '.valid' validation.json)" = "true"

      - name: Install pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" \
            | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish
